server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 50M;

  resolver 127.0.0.11 valid=300s;
  resolver_timeout 5s;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  root /usr/share/nginx/html;
  index index.html;

  location /uploads/ {
    alias /uploads/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /grafana/ {
    set $grafana_upstream http://grafana:3000;
    proxy_pass $grafana_upstream$request_uri;
    include proxy_params;
  }

  location = /metrics {
    deny all;
    return 403;
  }

  location /api/ {
    set $backend_upstream http://backend:4000;
    proxy_pass $backend_upstream$request_uri;
    include proxy_params;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
  }

  location / {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; font-src 'self' https: data:; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' https: 'unsafe-inline'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri /index.html;
  }
}
