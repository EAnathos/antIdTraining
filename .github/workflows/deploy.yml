name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      
      - name: Install
        run: npm install
      
      - name: Build backend
        run: npm run build -w apps/backend
      
      - name: Build frontend
        run: npm run build -w apps/frontend
      
      - name: Trigger deploy webhook
        if: success()
        run: |
          curl -X POST https://ant-id-training.anathos.me/deploy \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$(echo -n '${{ secrets.WEBHOOK_SECRET }}' | sha256sum | cut -d' ' -f1)" \
            -d '{"ref":"refs/heads/main"}' \
            --fail
