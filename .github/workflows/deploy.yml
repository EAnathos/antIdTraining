name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      
      - name: Install
        run: npm install
      
      - name: Build backend
        run: npm run build -w apps/backend
      
      - name: Build frontend
        run: npm run build -w apps/frontend
      
      - name: Trigger deploy webhook
        if: success()
        run: |
          BODY='{"ref":"refs/heads/main"}'
          SIGNATURE="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac '${{ secrets.WEBHOOK_SECRET }}' | awk '{print $2}')"
          curl -X POST https://ant-id-training.anathos.me/deploy \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$BODY" \
            --fail
